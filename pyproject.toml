[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-golden-stack"
version = "1.0.0"
description = "Unified In-Process P10..P50 AgentOps & Hook Multiplexer Bus (GoldenStackBus)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AGY Golden Stack Contributors", email = "129319184+agy-dev@users.noreply.github.com"}
]
keywords = ["agy", "agentops", "hook-multiplexer", "iso9001", "agile-v", "golden-stack"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
agy-golden-stack = "agy_golden_stack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
